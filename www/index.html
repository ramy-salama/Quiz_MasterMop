<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <script src="sql.js"></script>
    <script type="module" src="js/database-bridge.js"></script>
    <script src="js/database-loader.js"></script>
    <script src="js/database-mock.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Master</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        :root {
            --bg-color: #f8f9fa;
            --card-bg: white;
            --text-color: #333;
            --header-bg: #2c3e50;
            --border-color: #ecf0f1;
            --primary-color: #f58a38;
            --hover-color: #4a90e2;
            --section: #fdf3ea;
            --shadow: #d8dada;
            --danger-color: #e74c3c;
            --success-color: #2ecc71;
        }

        .dark-mode {
            --bg-color: #080c14;
            --card-bg: #1e2a3a;
            --text-color: #fff;
            --header-bg: #1e2a3a;
            --border-color: #404040;
            --primary-color: #357abd;
            --hover-color: #f58a38;
            --section: #222b3d;
            --shadow: #28505d;
            --danger-color: #ff6b6b;
            --success-color: #1dd1a1;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--header-bg);
            border-radius: 15px;
            box-shadow: 0 4px 12px var(--shadow);
            border-bottom: 10px solid var(--primary-color);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-title h1 {
            font-size: 2rem;
            color: white;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }


        .theme-toggle {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            border-radius: 50%;
            padding: 5px;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            background-color: rgba(255, 255, 255, 0.1);
            transform: scale(1.2);
            rotate: -45deg;
        }

        .custom-scroll {
            scrollbar-width: thin;
            scrollbar-color: var(--primary-color) rgba(0, 0, 0, 0.05);
        }

        .custom-scroll::-webkit-scrollbar {
            width: 8px;
        }

        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 4px;
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: var(--secondary-color);
        }

        .main-content {
            max-width: 1200px;
            margin: 0 auto;
        }

        .classes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 0 10px;
        }

        .classes-header h2 {
            font-size: 1.8rem;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .add-class-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .add-class-btn:hover {
            background: var(--hover-color);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .classes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr));
            gap: clamp(15px, 2vw, 30px);
            margin-top: 20px;
        }

        .class-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 25px;
            border: 2px solid var(--border-color);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .class-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
            box-shadow: 0 10px 25px var(--shadow);
        }

        .class-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .class-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-color);
        }

        .class-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .edit-btn {
            color: var(--hover-color);
        }

        .delete-btn {
            color: var(--danger-color);
        }

        .action-btn:hover {
            background-color: var(--section);
        }

        .class-info {
            margin: 20px 0;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            color: var(--text-color);
            opacity: 0.9;
        }

        .enter-btn {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .enter-btn:hover {
            background: var(--hover-color);
        }

        .empty-state {
            grid-column: 1/-1;
            text-align: center;
            padding: 60px 20px;
            background-color: var(--section);
            border-radius: 15px;
            border: 2px dashed var(--border-color);
        }

        .empty-icon {
            font-size: 4rem;
            color: var(--border-color);
            margin-bottom: 20px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            border: 2px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .modal h3 {
            margin-bottom: 20px;
            color: var(--text-color);
            font-size: 1.5rem;
        }

        .modal-input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1.1rem;
            background: var(--section);
            color: var(--text-color);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .modal-btn-primary:hover {
            background: var(--hover-color);
        }

        .modal-btn-secondary {
            background: var(--border-color);
            color: var(--text-color);
        }

        .modal-btn-secondary:hover {
            background: var(--border-color);
            opacity: 0.8;
        }

        .temp-modal {
            display: flex !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            background: rgba(0, 0, 0, 0.5) !important;
            z-index: 2000 !important;
            justify-content: center !important;
            align-items: center !important;
        }
    </style>

</head>

<body class="custom-scroll">
    <div class="main-content">
        <header class="header">
            <div class="header-title">
                <img src="build/icon.png" alt="علوم" width="60" height="60">
                <h1> Miss: Amal Asad </h1>
            </div>
            <div class="header-controls">
                <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
            </div>
        </header>

        <div class="classes-section">
            <div class="classes-header">
                <h2>📜 قائمة الصفوف</h2>
                <button class="add-class-btn" id="addClassBtn">➕ إضافة صف جديد</button>
            </div>

            <div class="classes-grid" id="classesList"></div>
        </div>
    </div>

    <!-- نافذة إضافة صف -->
    <div class="modal-overlay" id="addClassModal">
        <div class="modal">
            <h3>➕ إضافة صف جديد</h3>
            <input type="text" id="classNameInput" class="modal-input" placeholder="اسم الصف">
            <input type="text" id="classDescInput" class="modal-input" placeholder="وصف الصف (اختياري)">
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-primary" id="confirmAddBtn">إضافة</button>
                <button class="modal-btn modal-btn-secondary" id="cancelAddBtn">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        async function loadClasses() {
            const classes = await window.database.getClasses();
            displayClasses(classes);
        }

        async function displayClasses(classes) {
            const container = document.getElementById('classesList');

            if (!classes || classes.length === 0) {
                container.innerHTML = `
            <div class="empty-state">
                <div class="emoji-icon" style="font-size:4rem;">📚</div>
                <h3>لا توجد صفوف بعد</h3>
                <p>ابدأ بإضافة صفك الأول</p>
            </div>
        `;
                return;
            }

            container.innerHTML = '';
            for (const cls of classes) {
                const card = document.createElement('div');
                card.className = 'class-card';

                card.innerHTML = `
            <div class="class-header">
                <div class="class-name">${cls.name}</div>
                <div class="class-actions">
                    <button class="action-btn edit-btn" onclick="editClass(${cls.id}, \`${cls.name}\`, \`${cls.description || ''}\`)">✏️</button>
                    <button class="action-btn delete-btn" onclick="deleteClass(${cls.id})">🗑️</button>
                </div>
            </div>
            <div class="class-info">
                <div class="info-item">ℹ️ ${cls.description || 'لا يوجد وصف'}</div>
                <div class="info-item">📅 تم الإنشاء: ${new Date(cls.created_at).toLocaleDateString('ar-US')}</div>
            </div>
            <button class="enter-btn" onclick="enterClass(${cls.id}, \`${cls.name}\`)">🚪 دخول الصف</button>
        `;

                container.appendChild(card);
            }
        }

        function enterClass(id, name) {
            window.location.href = `screens/class-details.html?id=${id}&name=${encodeURIComponent(name)}`;
        }

        /* تعديل صف */
        function editClass(id, oldName, oldDesc) {
            const modalId = "editModal_" + Date.now();

            const modalHTML = `
        <div class="temp-modal" id="${modalId}">
            <div class="modal">
                <h3>✏️ تعديل الصف</h3>
                <input type="text" class="modal-input" id="editName_${modalId}" value="${oldName}">
                <input type="text" class="modal-input" id="editDesc_${modalId}" value="${oldDesc}">
                <div class="modal-buttons">
                    <button class="modal-btn modal-btn-primary" id="save_${modalId}">حفظ</button>
                    <button class="modal-btn modal-btn-secondary" id="cancel_${modalId}">إلغاء</button>
                </div>
            </div>
        </div>
    `;
            document.body.insertAdjacentHTML("beforeend", modalHTML);

            const nameInput = document.getElementById(`editName_${modalId}`);
            const descInput = document.getElementById(`editDesc_${modalId}`);

            document.getElementById(`save_${modalId}`).onclick = async () => {
                const newName = nameInput.value.trim();
                const newDesc = descInput.value.trim();
                if (!newName) return alert("ادخل اسم الصف");

                await window.database.updateClass(id, newName, newDesc);
                document.getElementById(modalId).remove();
                loadClasses();
            };

            document.getElementById(`cancel_${modalId}`).onclick = () => {
                document.getElementById(modalId).remove();
            };
        }

        /* إضافة صف */
        addClassBtn.onclick = () => {
            addClassModal.style.display = 'flex';
            classNameInput.value = '';
            classDescInput.value = '';
        };

        confirmAddBtn.onclick = async () => {
            const name = classNameInput.value.trim();
            const desc = classDescInput.value.trim();
            if (!name) return alert('ادخل اسم الصف');

            await window.database.addClass(name, desc);
            addClassModal.style.display = 'none';
            loadClasses();
        };

        cancelAddBtn.onclick = () => {
            addClassModal.style.display = 'none';
        };

        /* حذف صف */
        async function deleteClass(id) {
            if (!confirm("هل أنت متأكد من حذف الصف؟")) return;
            await window.database.deleteClass(id);
            loadClasses();
        }

        // استعادة المود عند تحميل الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            const savedMode = localStorage.getItem('darkMode');
            const themeToggle = document.querySelector('.theme-toggle');

            if (savedMode === 'true') {
                document.body.classList.add('dark-mode');
                themeToggle.textContent = '☀️';
            } else {
                document.body.classList.remove('dark-mode');
                themeToggle.textContent = '🌙';
            }
        });

        // تبديل المود عند الضغط
        function toggleTheme() {
            const themeToggle = document.querySelector('.theme-toggle');
            document.body.classList.toggle('dark-mode');
            const isDarkMode = document.body.classList.contains('dark-mode');

            themeToggle.textContent = isDarkMode ? '☀️' : '🌙';
            localStorage.setItem('darkMode', isDarkMode);
        }

        /* تحميل */
        document.addEventListener('DOMContentLoaded', loadClasses);
    </script>
    
    <script>
    window.waitForDatabase(() => {
        loadClasses();
    });
</script>
</body>

</html>
