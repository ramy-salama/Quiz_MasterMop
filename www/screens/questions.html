<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Master - بنك الأسئلة</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      transition: background-color 0.1s, color 0.1s;
    }

    :root {
      --bg-color: #f8f9fa;
      --card-bg: white;
      --text-color: #333;
      --header-bg: #2c3e50;
      --border-color: #ecf0f1;
      --primary-color: #f58a38;
      --hover-color: #4a90e2;
      --section: #fdf3ea;
      --shadow: #d8dada;
      --danger-color: #e74c3c;
      --success-color: #2ecc71;
    }

    .dark-mode {
      --bg-color: #080c14;
      --card-bg: #1e2a3a;
      --text-color: #ffffff;
      --header-bg: #1e2a3a;
      --border-color: #404040;
      --primary-color: #357abd;
      --hover-color: #f58a38;
      --section: #222b3d;
      --shadow: #28505d;
      --danger-color: #ff6b6b;
      --success-color: #1dd1a1;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      padding: 15px;
      overflow-x: hidden;
    }

    .custom-scroll {
      scrollbar-width: thin;
      scrollbar-color: var(--primary-color) rgba(0, 0, 0, 0.05);
    }

    .custom-scroll::-webkit-scrollbar {
      width: 8px;
    }

    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
      border-radius: 4px;
    }

    .custom-scroll::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: var(--secondary-color);
    }

    .container {
      max-width: 1800px;
      margin: 0 auto;
    }

    /* الهيدر - FIXED */
    .class-header {
      position: fixed;
      top: 0;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--header-bg);
      padding: 12px 25px;
      border-radius: 12px;
      box-shadow: 0 5px 15px var(--shadow);
      border-bottom: 10px solid var(--primary-color);
      z-index: 1000;
      height: 70px;
    }

    .back-btn {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
      white-space: nowrap;
    }

    .back-btn:hover {
      background: var(--hover-color);
      transform: translateY(-2px);
    }

    .class-title {
      display: flex;
      align-items: center;
      gap: 10px;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .class-title h1 {
      font-size: 1.4rem;
      color: white;
      margin: 0;
      white-space: nowrap;
    }

    .emoji-icon {
      font-size: inherit;
      line-height: 1;
      display: inline-block;
    }

    .header-controls {
      display: flex;
      gap: 10px;
      margin-left: auto;
    }

    .theme-toggle {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      border-radius: 50%;
      padding: 5px;
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .theme-toggle:hover {
      background-color: rgba(255, 255, 255, 0.1);
      transform: scale(1.2);
      rotate: -45deg;
    }

    /* المحتوى الرئيسي */
    .main-content {
      display: flex;
      gap: 15px;
      margin-top: 85px;
      /* مسافة من الهيدر الثابت */
      min-height: calc(100vh - 115px);
    }

    /* الجانب الأيسر - الوحدات - FIXED */
    .sidebar {
      position: sticky;
      top: 100px;
      /* تحت الهيدر مباشرة */
      width: 300px;
      flex-shrink: 0;
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      border: 2px solid var(--border-color);
      box-shadow: 0 5px 15px var(--shadow);
      height: calc(100vh - 130px);
      /* ارتفاع ثابت */
      display: flex;
      flex-direction: column;
      z-index: 900;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border-color);
      flex-shrink: 0;
    }

    .panel-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .add-btn {
      background: none;
      border: none;
      color: var(--text-color);
      font-size: 1.1rem;
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .add-btn:hover {
      background: var(--section);
      transform: scale(1.1);
    }

    /* قائمة الوحدات مع سكرول ثابت */
    .units-list {
      list-style: none;
      overflow-y: auto;
      overflow-x: hidden;
      width: 100%;
      flex: 1;
      min-height: 0;
    }

    .unit-item {
      padding: 10px 12px;
      margin-bottom: 6px;
      background: var(--section);
      border-radius: 8px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      min-width: 0;
      flex-shrink: 0;
    }

    .unit-item:hover {
      border-color: var(--primary-color);
    }

    .unit-item.active {
      background: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }

    .unit-info {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      min-width: 0;
      overflow: hidden;
    }

    .unit-name {
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }

    .unit-count {
      background: var(--card-bg);
      color: var(--text-color);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 600;
      min-width: 30px;
      text-align: center;
      flex-shrink: 0;
    }

    .unit-item.active .unit-count {
      background: white;
      color: var(--primary-color);
    }

    .unit-actions {
      display: flex;
      gap: 5px;
      opacity: 0;
      transition: opacity 0.3s;
      flex-shrink: 0;
    }

    .unit-item:hover .unit-actions {
      opacity: 1;
    }

    .unit-action-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .edit-unit-btn {
      color: var(--hover-color);
    }

    .delete-unit-btn {
      color: var(--danger-color);
    }

    /* سكرول بار */
    .custom-scroll {
      scrollbar-width: thin;
      scrollbar-color: var(--border-color) rgba(0, 0, 0, 0.05);
    }

    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }

    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
      border-radius: 4px;
    }

    .custom-scroll::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: var(--primary-color);
    }

    /* المحتوى الرئيسي - الأنواع والأسئلة */
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 15px;
      min-width: 0;
    }

    /* أنواع الأسئلة */
    .question-types {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      border: 2px solid var(--border-color);
      box-shadow: 0 5px 15px var(--shadow);
      min-height: 150px;
    }

    .types-tabs {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .type-tab {
      flex: 1;
      padding: 12px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      background: var(--section);
      color: var(--text-color);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 1rem;
      min-width: 0;
    }

    .type-tab:hover {
      border-color: var(--primary-color);
      transform: translateY(-2px);
    }

    .type-tab.active {
      background: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }

    /* قسم الأسئلة مع ارتفاع ثابت */
    .questions-section {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      border: 2px solid var(--border-color);
      box-shadow: 0 5px 15px var(--shadow);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 400px;
    }

    .questions-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border-color);
      flex-shrink: 0;
    }

    .questions-list {
      flex: 1;
      overflow-y: auto;
      padding: 5px;
      min-height: 0;
    }

    /* قائمة الأسئلة */
    .question-row {
      padding: 12px;
      margin-bottom: 8px;
      background: var(--section);
      border-radius: 8px;
      border: 1px solid var(--border-color);
      transition: all 0.3s;
      flex-shrink: 0;
    }

    .question-row:hover {
      border-color: var(--primary-color);
      background: var(--card-bg);
    }

    .question-main {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 8px;
    }

    .question-text {
      flex: 1;
      font-weight: 600;
      font-size: 1rem;
      line-height: 1.4;
      min-width: 0;
      word-break: break-word;
    }

    .question-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .action-btn {
      padding: 5px 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.3s;
      white-space: nowrap;
    }

    .edit-btn {
      background: var(--hover-color);
      color: white;
    }

    .delete-btn {
      background: var(--danger-color);
      color: white;
    }

    .action-btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    .question-answer {
      color: var(--text-color);
      opacity: 0.9;
      font-size: 0.9rem;
      padding: 8px 12px;
      background: var(--card-bg);
      border-radius: 6px;
      border-right: 3px solid var(--success-color);
      margin-top: 5px;
      line-height: 1.4;
      word-break: break-word;
    }

    .question-type-badge {
      display: inline-block;
      background: var(--primary-color);
      color: white;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-left: 10px;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .empty-questions {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-color);
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .empty-icon {
      font-size: 2.5rem;
      margin-bottom: 10px;
      opacity: 0.5;
    }

    /* نوافذ مؤقتة */
    .temp-modal {
      display: flex !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: rgba(0, 0, 0, 0.5) !important;
      z-index: 2000 !important;
      justify-content: center !important;
      align-items: center !important;
    }

    .modal {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      width: 90%;
      max-width: 500px;
      border: 2px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .modal h3 {
      margin-bottom: 15px;
      color: var(--text-color);
      font-size: 1.3rem;
    }

    .modal-input,
    textarea {
      outline: none !important;
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid var(--primary-color);
      border-radius: 6px;
      font-size: 1rem;
      background: var(--section);
      color: var(--text-color);
      resize: vertical;
    }

    .modal-input:focus,
    textarea:focus {
      box-shadow: 0 2px 5px var(--shadow);
    }

    textarea {
      min-height: 80px;
    }

    .option-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
    }

    .option-input {
      outline: none !important;
      flex: 1;
      padding: 8px;
      border: 1px solid var(--border-color);
      border-radius: 5px;
      background: var(--section);
      color: var(--text-color);
      font-size: 0.95rem;
      min-width: 0;
    }

    .correct-option {
      outline: none !important;
      border-color: var(--success-color) !important;
      box-shadow: 0 2px 5px var(--shadow);
    }

    .option-btn {
      background: none;
      border: 1px solid var(--border-color) !important;
      box-shadow: 0 1px 2px var(--shadow);
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .option-btn.selected-correct {
      background: rgba(0, 255, 17, 0.1) !important;
      color: white !important;
      font-weight: bold;
    }

    .true-false-buttons {
      display: flex;
      gap: 12px;
      margin: 12px 0;
    }

    .tf-btn {
      flex: 1;
      padding: 12px;
      border: 3px solid var(--border-color);
      border-radius: 8px;
      background: var(--section);
      color: var(--text-color);
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tf-btn.selected {
      border-color: var(--success-color);
      background: var(--success-color);
      color: white;
    }

    .modal-buttons {
      display: flex;
      gap: 8px;
      margin-top: 15px;
      justify-content: flex-end;
    }

    .modal-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 0.9rem;
    }

    .modal-btn-primary {
      background: var(--primary-color);
      color: white;
    }

    .modal-btn-secondary {
      background: var(--border-color);
      color: var(--text-color);
    }

    .tiny-chem-btn {
      width: 32px !important;
      height: 32px !important;
      padding: 0 !important;
      margin: 0 !important;
      border: 2px solid var(--primary-color) !important;
      background: var(--card-bg) !important;
      color: var(--text-color) !important;
      border-radius: 6px !important;
      font-size: 14px !important;
      font-weight: bold !important;
      cursor: pointer !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      transition: all 0.2s !important;
      box-shadow: 0 2px 4px var(--shadow) !important;
    }

    .tiny-chem-btn:hover {
      background: var(--primary-color) !important;
      color: white !important;
      transform: translateY(-2px) !important;
      box-shadow: 0 4px 8px var(--shadow) !important;
    }

    .tiny-chem-btn:active {
      transform: translateY(0) !important;
    }

    /* تعديلات للشاشات الصغيرة */
    @media (max-width: 1200px) {
      .sidebar {
        width: 280px;
      }
    }

    @media (max-width: 992px) {
      .main-content {
        flex-direction: column;
      }

      .sidebar {
        position: relative;
        top: 0;
        width: 100%;
        height: 350px;
        margin-bottom: 15px;
      }

      .class-title {
        position: relative;
        left: 0;
        transform: none;
        flex: 1;
        justify-content: center;
      }

      .header-controls {
        margin-left: 0;
      }
    }

    @media (max-width: 768px) {
      .class-header {
        flex-direction: row;
        flex-wrap: wrap;
        height: auto;
        padding: 10px 15px;
      }

      .back-btn {
        order: 1;
        width: auto;
      }

      .class-title {
        order: 3;
        width: 100%;
        margin-top: 10px;
        justify-content: center;
      }

      .header-controls {
        order: 2;
      }

      .sidebar {
        height: 300px;
      }

      .types-tabs {
        flex-direction: column;
      }

      .question-main {
        flex-direction: column;
        gap: 10px;
      }

      .question-actions {
        align-self: flex-end;
      }

      .type-tab {
        padding: 10px;
      }
    }
  </style>

</head>

<body class="custom-scroll">
  <div class="container">
    <!-- الهيدر -->
    <header class="class-header">


      <div class="header-controls">
        <button class="icon-btn theme-toggle" id="themeToggle">
          <span class="emoji-icon">🌙</span>
        </button>
      </div>
      <div class="class-title">
        <span style="font-size: 25px; color: #ffffff;">الصف :</span>
        <h1 id="classTitle">الصف الأول ثانوي</h1>
      </div>
      <div>
        <button class="back-btn" onclick="goBack()">
          <span class="emoji-icon">←</span> العودة
        </button>
      </div>

    </header>

    <!-- المحتوى الرئيسي -->
    <div class="main-content">
      <!-- الجانب الأيسر - الوحدات -->
      <aside class="sidebar custom-scroll">
        <div class="panel-header">
          <div class="panel-title">
            <span class="emoji-icon">📚</span> الوحدات
          </div>
          <button class="add-btn" id="addUnitBtn" onclick="showUnitModal()">➕</button>
        </div>
        <ul class="units-list custom-scroll" id="unitsList">
          <!-- الوحدات سيتم تحميلها هنا ديناميكيًا -->
        </ul>
      </aside>

      <!-- المحتوى الرئيسي - أنواع الأسئلة والأسئلة -->
      <div class="content-area">
        <!-- أنواع الأسئلة -->
        <section class="question-types">
          <div class="panel-title">
            <span id="currentTypeIcon">❓</span>
            <span id="currentTypeTitle">اختر نوع السؤال أولاً</span>
          </div>
          <div class="types-tabs">
            <div class="type-tab" id="tabEssay" onclick="openQuestionType('essay')">
              <span class="emoji-icon">✍️</span> مقالي
            </div>
            <div class="type-tab" id="tabMcq" onclick="openQuestionType('mcq')">
              <span class="emoji-icon">🔘</span> اختيار من متعدد
            </div>
            <div class="type-tab" id="tabTrueFalse" onclick="openQuestionType('truefalse')">
              <span class="emoji-icon">✔️</span> صح/خطأ ❌
            </div>
          </div>
        </section>

        <!-- قائمة الأسئلة -->
        <section class="questions-section">
          <div class="questions-header">
            <div>قائمة الأسئلة</div>
            <button class="add-btn" id="addQuestionBtn" style="display: none" onclick="handleAddQuestion()">
              ➕
            </button>
          </div>
          <div class="questions-list" id="questionsList">
            <!-- الأسئلة سيتم تحميلها هنا ديناميكيًا -->
          </div>
        </section>
      </div>
    </div>
  </div>

  <!-- ربط ملف الجافاسكريبت -->
  <script src="main.js"></script>

  <script>
    let currentClassId = null;
    let currentClassName = "";
    let currentUnitId = null;
    let currentUnitName = "";
    let currentQuestionType = "";
    let editingQuestionId = null;
    let editingUnitId = null;
    let lastFocusedInput = null;

    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      currentClassId = urlParams.get("class");
      currentClassName = urlParams.get("name") || "الصف الأول ثانوي";

      document.getElementById("classTitle").textContent = currentClassName;
      loadUnits();
      setupEventListeners();
    });

    function setupEventListeners() {
      const toggleBtn = document.getElementById("themeToggle");
      const icon = document.querySelector("#themeToggle span");

      // استعادة المود عند تحميل الصفحة
      const savedMode = localStorage.getItem("darkMode");
      if (savedMode === "true") {
        document.body.classList.add("dark-mode");
        icon.textContent = "☀️";
      } else {
        document.body.classList.remove("dark-mode");
        icon.textContent = "🌙";
      }

      // تبديل المود عند الضغط على الزر
      toggleBtn.onclick = () => {
        document.body.classList.toggle("dark-mode");
        const isDark = document.body.classList.contains("dark-mode");

            <script>
                let isArabic = true;
                let isCaps = false;
                
                function typeChar(char) {
                    const input = document.getElementById('textInput');
                    const start = input.selectionStart;
                    const end = input.selectionEnd;
                    
                    if (isCaps && !isArabic && char >= 'a' && char <= 'z') {
                        char = char.toUpperCase();
                    }
                    
                    input.value = input.value.substring(0, start) + char + input.value.substring(end);
                    input.selectionStart = input.selectionEnd = start + 1;
                    input.focus();
                }
                
                function backspace() {
                    const input = document.getElementById('textInput');
                    const start = input.selectionStart;
                    const end = input.selectionEnd;
                    if (start > 0) {
                        input.value = input.value.substring(0, start - 1) + input.value.substring(end);
                        input.selectionStart = input.selectionEnd = start - 1;
                    }
                    input.focus();
                }
                
                function insertText() {
                    const text = document.getElementById('textInput').value;
                    try {
                        window.opener.document.getElementById('${inputElement.id}').value = text;
                        window.opener.document.getElementById('${inputElement.id}').focus();
                    } catch(e) {
                        console.log('Error:', e);
                    }
                    window.close();
                }
                
                function toggleLang() {
                    isArabic = !isArabic;
                    document.getElementById('langBtn').textContent = isArabic ? 'عربي' : 'ENG';
                    document.getElementById('arabicKeyboard').style.display = isArabic ? 'flex' : 'none';
                    document.getElementById('englishKeyboard').style.display = isArabic ? 'none' : 'flex';
                }
                
                function toggleCaps() {
                    isCaps = !isCaps;
                    const capsBtns = document.querySelectorAll('.key.caps');
                    capsBtns.forEach(btn => {
                        if (isCaps) {
                            btn.classList.add('active');
                            btn.textContent = 'CAPS ON';
                        } else {
                            btn.classList.remove('active');
                            btn.textContent = 'CAPS';
                        }
                    });
                    
                    if (!isArabic) {
                        updateEnglishKeys();
                    }
                }
                
                function updateEnglishKeys() {
                    const englishKeys = document.querySelectorAll('#englishKeyboard .key[data-char]');
                    englishKeys.forEach(key => {
                        const originalChar = key.getAttribute('data-char');
                        let displayChar = originalChar;
                        
                        if (isCaps && originalChar >= 'a' && originalChar <= 'z') {
                            displayChar = originalChar.toUpperCase();
                        }
                        
                        key.textContent = displayChar;
                        key.onclick = function() {
                            typeChar(originalChar);
                        };
                    });
                }
                
                document.getElementById('textInput').focus();
                document.getElementById('textInput').select();
                
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') window.close();
                    if (e.key === 'Enter') insertText();
                });
                
                // تنبيه عند محاولة إغلاق النافذة
                window.onbeforeunload = function() {
                    try {
                        window.opener.keyboardIsOpen = false;
                    } catch(e) {}
                };
            <\/script>
        </body>

    `);

    async function loadUnits() {
      try {
        const units = await window.database.getUnits(
          parseInt(currentClassId)
        );
        displayUnits(units);
        if (units.length > 0 && !currentUnitId)
          selectUnit(units[0].id, units[0].name);
      } catch (error) {
        console.error(error);
        alert("حدث خطأ في تحميل الوحدات");
      }
    }

    function displayUnits(units) {
      const unitsList = document.getElementById("unitsList");
      if (!units || units.length === 0) {
        unitsList.innerHTML = `<div style="text-align:center;padding:15px;color:var(--text-color);opacity:0.7;">
            <div style="font-size:1.5rem;margin-bottom:8px;">📚</div>
            <div>لا توجد وحدات بعد</div>
        </div>`;
        return;
      }
      unitsList.innerHTML = units
        .map(
          (unit) => `
        <li class="unit-item ${currentUnitId === unit.id ? "active" : ""}">
            <div class="unit-info" onclick="selectUnit(${unit.id
            }, '${unit.name.replace(/'/g, "\\'")}')">
                <div class="unit-name">${unit.name}</div>
                <div class="unit-count">${unit.question_count || 0}</div>
            </div>
            <div class="unit-actions">
                <button class="unit-action-btn edit-unit-btn" onclick="editUnit(${unit.id
            }, '${unit.name.replace(/'/g, "\\'")}', event)">
                    <span class="emoji-icon">✏️</span>
                </button>
                <button class="unit-action-btn delete-unit-btn" onclick="deleteUnit(${unit.id
            }, event)">
                    <span class="emoji-icon">🗑️</span>
                </button>
            </div>
        </li>
    `
        )
        .join("");
    }

    function showUnitModal(unitId = null, unitName = "") {
      editingUnitId = unitId;
      const modalId = "unitModal_" + Date.now();
      const title = unitId ? "تعديل الوحدة" : "إضافة وحدة جديدة";
      const action = unitId ? "تحديث" : "حفظ";
      document.body.insertAdjacentHTML(
        "beforeend",
        `
        <div id="${modalId}" class="temp-modal">
            <div class="modal">
                <h3><span class="emoji-icon">📚</span> ${title}</h3>
                <input type="text" class="modal-input" id="unitName_${modalId}" placeholder="اسم الوحدة" 
                       value="${unitName}" onclick="openWebKeyboard(this)">
                <div class="modal-buttons">
                    <button class="modal-btn modal-btn-primary" id="saveUnit_${modalId}">💾 ${action}</button>
                    <button class="modal-btn modal-btn-secondary" id="cancelUnit_${modalId}">❌ إلغاء</button>
                </div>
            </div>
        </div>
    `
      );
      document.getElementById(`saveUnit_${modalId}`).onclick = async () => {
        const name = document
          .getElementById(`unitName_${modalId}`)
          .value.trim();
        if (!name) return alert("يرجى إدخال اسم الوحدة");
        try {
          if (editingUnitId)
            await window.database.updateUnit(editingUnitId, name);
          else await window.database.addUnit(parseInt(currentClassId), name);
          document.getElementById(modalId).remove();
          loadUnits();
          editingUnitId = null;
        } catch (e) {
          console.error(e);
          alert("حدث خطأ في حفظ الوحدة");
        }
      };
      document.getElementById(`cancelUnit_${modalId}`).onclick = () => {
        document.getElementById(modalId).remove();
        editingUnitId = null;
      };
      setTimeout(() => {
        const input = document.getElementById(`unitName_${modalId}`);
        if (input) {
          input.focus();
          input.select();
        }
      }, 50);
    }

    function editUnit(unitId, unitName, e) {
      e.stopPropagation();
      showUnitModal(unitId, unitName);
    }

    async function deleteUnit(unitId, e) {
      e.stopPropagation();
      if (!confirm("هل تريد حذف هذه الوحدة وجميع أسئلتها؟")) return;
      try {
        await window.database.deleteUnit(unitId);
        if (currentUnitId === unitId) {
          currentUnitId = null;
          currentQuestionType = "";
        }
        loadUnits();
      } catch (error) {
        console.error(error);
        alert("حدث خطأ في حذف الوحدة");
      }
    }

    async function selectUnit(unitId, unitName) {
      currentUnitId = unitId;
      currentUnitName = unitName;
      document
        .querySelectorAll(".unit-item")
        .forEach((i) => i.classList.remove("active"));
      const activeItem = Array.from(
        document.querySelectorAll(".unit-item")
      ).find((li) =>
        li
          .querySelector(".unit-info")
          .onclick.toString()
          .includes(`selectUnit(${unitId},`)
      );
      if (activeItem) activeItem.classList.add("active");
      document.getElementById("addQuestionBtn").style.display = "none";
      document.getElementById("currentTypeTitle").textContent =
        "اختر نوع السؤال أولاً";
      if (currentQuestionType) loadQuestions(currentQuestionType);
    }

    function openQuestionType(type) {
      if (!currentUnitId) {
        alert("يرجى اختيار وحدة أولاً");
        return;
      }

      currentQuestionType = type;

      // تحديث التحديد البصري للأزرار
      document
        .querySelectorAll(".type-tab")
        .forEach((tab) => tab.classList.remove("active"));

      // إضافة active للزر المختار
      if (type === "truefalse") {
        // إزالة اللون القديم من كل tf-tab (لو عملت لهم class منفصل)
        document
          .querySelectorAll(".tf-tab")
          .forEach((btn) => btn.classList.remove("active"));
        // نضيف active للزر صح/خطأ
        document.getElementById("tabTrueFalse").classList.add("active");
      } else {
        document
          .getElementById(
            `tab${type.charAt(0).toUpperCase() + type.slice(1)}`
          )
          .classList.add("active");
      }

      // تحديث العنوان
      const typeData = {
        essay: { icon: "✍️", title: "أسئلة مقالية" },
        mcq: { icon: "🔘", title: "أسئلة اختيارية" },
        truefalse: { icon: "✔️❌", title: "أسئلة صح/خطأ" },
      };

      document.getElementById("currentTypeIcon").textContent =
        typeData[type].icon;
      document.getElementById("currentTypeTitle").textContent =
        typeData[type].title;
      document.getElementById("addQuestionBtn").style.display = "flex";

      // تحميل الأسئلة
      loadQuestions(type);
    }

    async function loadQuestions(type) {
      try {
        const questions = await window.database.getQuestions(
          parseInt(currentClassId),
          currentUnitId,
          type
        );
        displayQuestions(questions, type);
      } catch (e) {
        console.error(e);
        alert("حدث خطأ في تحميل الأسئلة");
      }
    }

    function displayQuestions(questions, type) {
      const questionsList = document.getElementById("questionsList");
      if (!questions || questions.length === 0) {
        questionsList.innerHTML = `<div class="empty-questions"><div class="empty-icon">❓</div><h3>لا توجد أسئلة بعد</h3><p>استخدم زر الإضافة لإنشاء سؤالك الأول</p></div>`;
        return;
      }

      questionsList.innerHTML = questions
        .map((q) => {
          const typeText =
            type === "essay"
              ? "مقالي"
              : type === "mcq"
                ? "اختياري"
                : "صح/خطأ";

          let answerText = "";

          // عرض الإجابة حسب النوع
          if (type === "essay") {
            answerText = q.answer || "لا توجد إجابة";
          }
          else if (type === "truefalse") {
            answerText = q.answer === "true" ? "الإجابة: صح" : "الإجابة: خطأ";
          }
          else if (type === "mcq") {
            // للأسئلة الاختيارية
            let options = [];
            try {
              if (q.options) options = JSON.parse(q.options);
            } catch {
              options = [];
            }

            if (q.answer && !isNaN(q.answer)) {
              // إذا كانت الإجابة رقم (1, 2, 3, 4)
              const answerIndex = parseInt(q.answer) - 1;
              const letters = ['أ', 'ب', 'ج', 'د'];
              const correctLetter = letters[answerIndex] || `الخيار ${q.answer}`;
              const correctOption = options[answerIndex] || `الخيار ${q.answer}`;
              answerText = `الإجابة الصحيحة: ${correctLetter} - ${correctOption}`;
            } else {
              // إذا كانت الإجابة نص (سابقاً)
              answerText = `الإجابة الصحيحة: ${q.answer || ""}`;
            }
          }

          return `<div class="question-row">
                <div class="question-main">
                    <div class="question-text">${q.text}<span class="question-type-badge">${typeText}</span></div>
                    <div class="question-actions">
                        <button class="action-btn edit-btn" onclick="editQuestion(${q.id})"><span class="emoji-icon">✏️</span> تعديل</button>
                        <button class="action-btn delete-btn" onclick="deleteQuestion(${q.id})"><span class="emoji-icon">🗑️</span> حذف</button>
                    </div>
                </div>
                <div class="question-answer">${answerText}</div>
            </div>`;
        })
        .join("");
    }

    // المودال لجميع أنواع الأسئلة
    function handleAddQuestion() {
      if (!currentUnitId) {
        alert("يرجى اختيار وحدة أولاً");
        return;
      }
      if (!currentQuestionType) {
        alert("يرجى اختيار نوع السؤال أولاً");
        return;
      }
      showQuestionModal();
    }

    function showQuestionModal(question = null) {
      editingQuestionId = question ? question.id : null;
      const modalId = "questionModal_" + Date.now();
      let html = "";

      // أزرار الرموز الكيميائية - نضعها في متغير لتكرارها
      const chemButtons = `
      <div style="margin-bottom: 12px;">
        <div style="display: flex; gap: 4px; margin-bottom: 5px; flex-wrap: wrap; justify-content: center;">
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('¹')">¹</button>
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('²')">²</button>
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('³')">³</button>
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('⁴')">⁴</button>
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('⁵')">⁵</button>
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('⁶')">⁶</button>
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('⁷')">⁷</button>
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('⁸')">⁸</button>
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('⁹')">⁹</button>
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('⁰')">⁰</button>
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('⁺')">⁺</button>
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('⁻')">⁻</button>
        </div>
        <div style="display: flex; gap: 4px; flex-wrap: wrap; justify-content: center;">
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('₁')">₁</button>
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('₂')">₂</button>
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('₃')">₃</button>
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('₄')">₄</button>
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('₅')">₅</button>
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('₆')">₆</button>
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('₇')">₇</button>
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('₈')">₈</button>
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('₉')">₉</button>
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('₀')">₀</button>
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('₊')">₊</button>
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('₋')">₋</button>
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('₍ₛ₎')">₍ₛ₎</button>
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('₍ₗ₎')">₍ₗ₎</button>
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('₍ℊ₎')">₍ℊ₎</button>
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('₍ᵥ₎')">₍ᵥ₎</button>
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('₍ₐզ₎')">₍ₐզ₎</button>
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('⇌')">⇌</button>
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('→')">→</button>
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('Δ')">Δ</button>
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('ᶜᵃᵗ.')">cat.</button>
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('ᵈⁱˡ')">ᵈⁱˡ</button>
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('ᶜᵒⁿᶜ')">ᶜᵒⁿᶜ</button>
            <button type="button" class="tiny-chem-btn" onclick="insertTinySymbol('C°')">C°</button>
        </div>
    </div>
    `;

      if (currentQuestionType === "essay") {
        const qtext = question ? question.text : "",
          ans = question ? question.answer : "";
        html = `<div id="${modalId}" class="temp-modal">
            <div class="modal">
                <h3><span class="emoji-icon">✍️</span> ${editingQuestionId ? "تعديل" : "إضافة"} سؤال مقالي</h3>
                
                ${chemButtons}
                
                <input type="text" class="modal-input" id="question_${modalId}" placeholder="نص السؤال" 
                       value="${qtext}" onclick="openWebKeyboard(this)">
                <textarea class="modal-input" id="answer_${modalId}" placeholder="الإجابة النموذجية" 
                          rows="3" onclick="openWebKeyboard(this)">${ans}</textarea>
                <div class="modal-buttons">
                    <button class="modal-btn modal-btn-primary" id="save_${modalId}">💾 ${editingQuestionId ? "تحديث" : "حفظ"}</button>
                    <button class="modal-btn modal-btn-secondary" id="cancel_${modalId}">❌ إلغاء</button>
                </div>
            </div>
        </div>`;

      } else if (currentQuestionType === "mcq") {
        const qtext = question ? question.text : "",
          opts = question && question.options
            ? JSON.parse(question.options)
            : ["", "", "", ""],
          correct = question ? question.answer : "";

        let correctIndex = -1;
        if (question && question.answer) {
          if (!isNaN(correct)) {
            correctIndex = parseInt(correct) - 1;
          } else {
            correctIndex = opts.findIndex(opt => opt === correct);
          }
        }

        let optsHTML = "";
        for (let i = 0; i < 4; i++) {
          const isCorrect = (correctIndex === i);
          optsHTML += `<div class="option-row">
                <input type="text" class="option-input ${isCorrect ? "correct-option" : ""}" 
                      id="option${i + 1}_${modalId}" 
                      placeholder="الاختيار ${i + 1}" 
                      value="${opts[i] || ''}"
                      onclick="openWebKeyboard(this)">
                <button type="button" class="option-btn ${isCorrect ? 'selected-correct' : ''}" 
                        onclick="markCorrectOption('option${i + 1}_${modalId}','${modalId}')">
                    ${isCorrect ? '✓' : ''}
                </button>
            </div>`;
        }

        html = `<div id="${modalId}" class="temp-modal">
            <div class="modal">
                <h3><span class="emoji-icon">🔘</span> ${editingQuestionId ? "تعديل" : "إضافة"} سؤال اختياري</h3>
                
                ${chemButtons}
                
                <input type="text" class="modal-input" id="question_${modalId}" placeholder="نص السؤال" 
                       value="${qtext}" onclick="openWebKeyboard(this)">
                ${optsHTML}
                <div class="modal-buttons">
                    <button class="modal-btn modal-btn-primary" id="save_${modalId}">💾 ${editingQuestionId ? "تحديث" : "حفظ"}</button>
                    <button class="modal-btn modal-btn-secondary" id="cancel_${modalId}">❌ إلغاء</button>
                </div>
            </div>
        </div>`;

      } else if (currentQuestionType === "truefalse") {
        const qtext = question ? question.text : "",
          ans = question ? question.answer : "";
        html = `<div id="${modalId}" class="temp-modal">
            <div class="modal">
                <h3><span class="emoji-icon">✔️❌</span> ${editingQuestionId ? "تعديل" : "إضافة"} سؤال صح/خطأ</h3>
                
                ${chemButtons}
                
                <input type="text" class="modal-input" id="question_${modalId}" placeholder="نص السؤال" 
                       value="${qtext}" onclick="openWebKeyboard(this)">
                <div class="true-false-buttons">
                    <button type="button" class="tf-btn ${ans === "true" ? "selected" : ""}" id="trueBtn_${modalId}" onclick="selectTrueFalse('true','${modalId}')"><span class="emoji-icon">✔️</span> صح</button>
                    <button type="button" class="tf-btn ${ans === "false" ? "selected" : ""}" id="falseBtn_${modalId}" onclick="selectTrueFalse('false','${modalId}')"><span class="emoji-icon">❌</span> خطأ</button>
                </div>
                <div class="modal-buttons">
                    <button class="modal-btn modal-btn-primary" id="save_${modalId}">💾 ${editingQuestionId ? "تحديث" : "حفظ"}</button>
                    <button class="modal-btn modal-btn-secondary" id="cancel_${modalId}">❌ إلغاء</button>
                </div>
            </div>
        </div>`;
      }

      document.body.insertAdjacentHTML("beforeend", html);
      setTimeout(() => {
        const modal = document.getElementById(modalId);
        if (!modal) return;

        modal.querySelectorAll("input, textarea").forEach(el => {
          el.addEventListener("focus", () => {
            lastFocusedInput = el;
          });
        });
      }, 0);

      document.getElementById(`save_${modalId}`).onclick = async () => {
        const qtext = document.getElementById(`question_${modalId}`).value.trim();
        if (!qtext) return alert("يرجى كتابة نص السؤال");

        try {
          if (currentQuestionType === "essay") {
            const ans = document.getElementById(`answer_${modalId}`).value.trim();
            if (editingQuestionId)
              await window.database.updateQuestion(editingQuestionId, qtext, ans, null);
            else
              await window.database.addQuestion(parseInt(currentClassId), currentUnitId, "essay", qtext, ans, null);
            loadQuestions("essay");

          } else if (currentQuestionType === "mcq") {
            const o = [1, 2, 3, 4].map((i) =>
              document.getElementById(`option${i}_${modalId}`).value.trim()
            );

            let correctNumber = 0;
            for (let i = 1; i <= 4; i++) {
              const optionInput = document.getElementById(`option${i}_${modalId}`);
              if (optionInput && optionInput.classList.contains("correct-option")) {
                correctNumber = i;
                break;
              }
            }

            if (o.some((v) => !v) || correctNumber === 0)
              return alert("يرجى ملء جميع الخيارات وتحديد الإجابة الصحيحة");

            if (editingQuestionId) {
              await window.database.updateQuestion(
                editingQuestionId,
                qtext,
                correctNumber.toString(),
                JSON.stringify(o)
              );
            } else {
              await window.database.addQuestion(
                parseInt(currentClassId),
                currentUnitId,
                "mcq",
                qtext,
                correctNumber.toString(),
                JSON.stringify(o)
              );
            }
            loadQuestions("mcq");

          } else if (currentQuestionType === "truefalse") {
            const ans = document.getElementById(`trueBtn_${modalId}`).classList.contains("selected")
              ? "true"
              : "false";
            if (editingQuestionId)
              await window.database.updateQuestion(editingQuestionId, qtext, ans, null);
            else
              await window.database.addQuestion(
                parseInt(currentClassId),
                currentUnitId,
                "truefalse",
                qtext,
                ans,
                null
              );
            loadQuestions("truefalse");
          }

          document.getElementById(modalId).remove();
          editingQuestionId = null;

        } catch (e) {
          console.error(e);
          alert("حدث خطأ في حفظ السؤال");
        }
      };

      document.getElementById(`cancel_${modalId}`).onclick = () => {
        document.getElementById(modalId).remove();
        editingQuestionId = null;
      };

      setTimeout(() => {
        const f = document.getElementById(`question_${modalId}`);
        if (f) f.focus();
      }, 50);
    }

    function markCorrectOption(optionId, modalId) {
      // إزالة التحديد من جميع الأزرار
      [1, 2, 3, 4].forEach((i) => {
        const optionInput = document.getElementById(`option${i}_${modalId}`);
        if (optionInput) {
          optionInput.classList.remove("correct-option");
          const optionBtn = optionInput.nextElementSibling;
          if (optionBtn) {
            optionBtn.classList.remove("selected-correct");
            optionBtn.innerHTML = "";
          }
        }
      });

      // تحديد الخيار الجديد
      const selectedInput = document.getElementById(optionId);
      if (selectedInput) {
        selectedInput.classList.add("correct-option");
        const selectedBtn = selectedInput.nextElementSibling;
        if (selectedBtn) {
          selectedBtn.classList.add("selected-correct");
          selectedBtn.innerHTML = "✓";
        }
      }
    }

    function selectTrueFalse(value, modalId) {
      document
        .getElementById(`trueBtn_${modalId}`)
        .classList.remove("selected");
      document
        .getElementById(`falseBtn_${modalId}`)
        .classList.remove("selected");
      document
        .getElementById(
          value === "true" ? `trueBtn_${modalId}` : `falseBtn_${modalId}`
        )
        .classList.add("selected");
    }

    async function editQuestion(questionId) {
      try {
        const question = await window.database.getQuestion(questionId);
        if (question) {
          // لا تغير النوع الحالي، مباشرة اعرض المودال
          showQuestionModal(question);
        }
      } catch (e) {
        console.error(e);
        alert("حدث خطأ في تحميل السؤال");
      }
    }

    async function deleteQuestion(questionId) {
      if (!confirm("هل تريد حذف هذا السؤال؟")) return;
      try {
        await window.database.deleteQuestion(questionId);
        loadQuestions(currentQuestionType);
      } catch (e) {
        console.error(e);
        alert("حدث خطأ في حذف السؤال");
      }
    }

    // دالة إدراج الرمز في المكان المناسب
    function insertTinySymbol(symbol) {
      if (!lastFocusedInput) return;

      const element = lastFocusedInput;

      // نتأكد إنه input أو textarea
      if (
        element.tagName !== "INPUT" &&
        element.tagName !== "TEXTAREA"
      )
        return;

      const start = element.selectionStart ?? element.value.length;
      const end = element.selectionEnd ?? element.value.length;
      const value = element.value;

      element.value =
        value.substring(0, start) +
        symbol +
        value.substring(end);

      element.focus();
      element.selectionStart = element.selectionEnd =
        start + symbol.length;
    }

    function goBack() {
      window.location.href = `class-details.html?id=${currentClassId}&name=${encodeURIComponent(
        currentClassName
      )}`;
    }

  </script>
