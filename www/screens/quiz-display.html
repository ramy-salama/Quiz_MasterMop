<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Master - عرض الأسئلة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --bg-color: #f8f9fa;
            --card-bg: white;
            --text-color: #333;
            --header-bg: #2c3e50;
            --border-color: #ecf0f1;
            --primary-color: #f58a38;
            --primary-hover: #f58a38;
            --secondary-color: #247bdf;
            --secondary-hover: #357abd;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --warning-color: #f58a38;
            --section: #fdf3ea;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        .dark-mode {
            --bg-color: #080c14;
            --card-bg: #1e2a3a;
            --text-color: #ffffff;
            --header-bg: #1e2a3a;
            --border-color: #404040;
            --primary-color: #357abd;
            --primary-hover: #4a90e2;
            --secondary-color: #f58a38;
            --secondary-hover: #f58a38;
            --success-color: #1dd1a1;
            --danger-color: #ff6b6b;
            --warning-color: #f58a38;
            --section: #222b3d;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* الهيدر */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--header-bg);
            padding: 20px 30px;
            border-radius: 15px;
            margin-bottom: 10px;
            top: 0;
            box-shadow: 0 5px 15px var(--shadow);
            border-bottom: 10px solid var(--primary-color);
        }

        .back-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0px 10px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: var(--secondary-hover);
            transform: translateY(-2px);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title h1 {
            font-size: 1.4rem;
            color: white;
            margin: 0;
        }

        .emoji-icon {
            font-size: 1.5rem;
        }

        .header-controls {
            display: flex;
            gap: 10px;
        }

        .theme-toggle {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            border-radius: 50%;
            padding: 5px;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            background-color: rgba(255, 255, 255, 0.1);
            transform: scale(1.2);
            rotate: -45deg;
        }

        /* المحتوى الرئيسي */
        .quiz-container {
            display: flex;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        /* السايدبار */
        .sidebar {
            width: 300px;
            background-color: var(--card-bg);
            border-left: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
            border-radius: 10px;

        }

        .units-section {
            padding: 15px;
            border-bottom: 2px solid var(--border-color);
            flex-shrink: 0;
            border-radius: 10px;
        }

        .units-section h3 {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 1.1rem;
            color: var(--text-color);
        }

        .units-list {
            list-style: none;
            max-height: 300px;
            overflow-y: auto;
            /* سكرول رأسي فقط */
            overflow-x: hidden;
            /* إخفاء السكرول الأفقي */
            width: 100%;
        }


        .unit-item {
            padding: 10px 12px;
            margin-bottom: 6px;
            background: var(--section);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            white-space: nowrap;
            /* النص في سطر واحد */
            overflow: hidden;
            text-overflow: ellipsis;
            /* نقط إذا طال */
            width: 100%;
        }

        .unit-item:hover {
            border-color: var(--primary-color);
            transform: translateX(-3px);
        }

        .unit-item.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .unit-name {
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .unit-count {
            background: var(--card-bg);
            color: var(--text-color);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            min-width: 24px;
            text-align: center;
        }

        .unit-item.active .unit-count {
            background: white;
            color: var(--primary-color);
        }

        /* أنواع الأسئلة داخل الوحدة */
        .unit-types {
            padding: 10px 15px 15px 15px;
            border-bottom: 2px solid var(--border-color);
            display: none;
            max-height: 300px;
            /* تحديد ارتفاع */
            overflow-y: auto;
            /* إظهار سكرول */
        }

        .unit-types.active {
            display: block;
        }

        /* كلاس عام للسكرول */
        .custom-scroll {
            scrollbar-width: thin;
            scrollbar-color: var(--border-color) rgba(0, 0, 0, 0.05);
        }

        .custom-scroll::-webkit-scrollbar {
            width: 8px;
        }

        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 4px;
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: var(--secondary-color);
        }

        .unit-types h4 {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 1rem;
            color: var(--text-color);
        }

        .type-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .type-btn {
            padding: 10px 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: var(--section);
            color: var(--text-color);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .type-btn:hover {
            border-color: var(--secondary-color);
            transform: translateX(-3px);
        }

        .type-btn.active {
            background: var(--secondary-color);
            color: white;
            border-color: var(--secondary-color);
        }

        .type-count {
            background: var(--card-bg);
            color: var(--text-color);
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .type-btn.active .type-count {
            background: white;
            color: var(--secondary-color);
        }

        /* منطقة المربعات */
        .questions-grid-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 15px;
            background: var(--bg-color);
        }

        .grid-header {
            margin-bottom: 15px;
            padding: 12px 15px;
            border-radius: 10px;
            background: var(--section);
            border: 1.5px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            flex-shrink: 0;
        }

        .grid-header h2 {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            color: var(--text-color);
            margin: 0;
            white-space: nowrap;
        }

        /* كل المحتويات في سطر واحد */
        .header-content {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* الإحصائيات في سطر */
        .stats {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            color: var(--text-color);
            white-space: nowrap;
        }

        /* ساعة التوقيت في نفس السطر */
        .stopwatch-btn {
            background: none;
            border: none;
            color: var(--primary-color);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
            border-radius: 5px;
            transition: all 0.2s;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .stopwatch-btn:hover {
            transform: scale(1.1);
        }

        /* إعادة ترتيب المحتوى */
        .stopwatch-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* النص داخل الأزرار */
        .stopwatch-btn span {
            display: none;
            /* نخفي النص */
        }

        /* إعادة تنسيق الزراير */
        #startStopwatch {
            color: var(--success-color);
        }

        #pauseStopwatch {
            color: var(--warning-color);
        }

        /* أيقونات الإيموجي */
        .emoji-icon {
            font-size: 1.5rem;
        }

        /* يجيبهم كلهم جنب بعض */
        .grid-header>* {
            flex: 0 0 auto;
        }

        /* شبكة المربعات */
        .questions-grid {
            flex: 1;
            overflow: auto;
            padding: 5px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(35px, 1fr));
            grid-auto-rows: 35px;
            gap: 6px;
            width: 100%;
        }

        /* المربعات 3D */
        .box {
            background: var(--secondary-color);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            cursor: pointer;
            user-select: none;
            font-size: 0.9rem;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);

            /* تأثير 3D */
            border: none;
            box-shadow:
                0 4px 0 var(--secondary-hover),
                0 6px 8px var(--shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .box:hover {
            transform: translateY(-2px);
            box-shadow:
                0 6px 0 var(--secondary-hover),
                0 8px 12px var(--shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .box:active {
            transform: translateY(2px);
            box-shadow:
                0 2px 0 var(--secondary-hover),
                0 4px 6px var(--shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        /* حالات المربع */

        .box.selected {
            background: var(--primary-color);
            box-shadow:
                0 4px 0 var(--primary-hover),
                0 6px 8px var(--shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            animation: pulse 2s infinite;
        }

        .box.selected:hover {
            box-shadow:
                0 6px 0 var(--primary-hover),
                0 8px 12px var(--shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .box.opened {
            background-color: var(--primary-color);
            color: #ffffff;
            font-weight: bold;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        /* نافذة السؤال */
        .question-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .question-modal.active {
            display: flex;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .question-content {
            background: var(--card-bg);
            border-radius: 20px;
            width: 90%;
            max-width: 800px;
            height: 600px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            border: 3px solid var(--border-color);
        }

        .question-header {
            background: var(--header-bg);
            color: white;
            padding: 20px;
            height: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            border-bottom: 4px solid var(--primary-color);
        }

        .question-header h3 {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            margin: 0;
        }

        .timer-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 12px;
            border-radius: 40px;
            font-weight: bold;
        }

        .timer {
            font-size: 1.5rem;
            font-family: 'Courier New', monospace;
            color: #ffeb3b;
        }

        .close-btn {
            background: var(--danger-color);
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.3rem;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: #ff3838;
            transform: scale(1.1);
        }

        .question-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .question-text {
            font-size: 1.5rem;
            line-height: 1.2;
            margin-bottom: 5px;
            color: var(--text-color);
            text-align: center;
            font-weight: 500;
        }

        .answer-section {
            margin-top: 5px;
            padding-top: 20px;
            border-top: 3px solid var(--border-color);
        }

        .answer-text {
            font-size: 1.3rem;
            line-height: 1.6;
            color: var(--text-color);
            background: var(--section);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--primary-color);
            border-right: 5px solid var(--primary-color);
            font-weight: 500;
        }

        .answer-text.wrong {
            color: var(--danger-color);
            background: rgba(231, 76, 60, 0.1);
            border-right-color: var(--danger-color);
        }

        .question-footer {
            padding: 10px;
            background: var(--section);
            border-top: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .reveal-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 7px 15px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .reveal-btn:hover {
            background: var(--secondary-hover);
            transform: translateY(-2px);
        }

        .question-info {
            display: flex;
            gap: 20px;
            color: var(--text-color);
            opacity: 0.8;
            font-size: 0.9rem;
        }

        /* أضف هذا في قسم الـ style في كلا الملفين */
        .question-options {
            margin: 15px 0;
            padding: 5px;
            background: var(--section);
            border-radius: 12px;
            border: 2px solid var(--border-color);
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            margin-bottom: 8px;
            background: var(--card-bg);
            border-radius: 10px;
            border: 1px solid var(--secondary-hover);
            border-right: 5px solid var(--secondary-hover);
            transition: all 0.3s;
            cursor: pointer;
            font-size: 3rem;
            font-weight: 500;
        }

        .option-item:hover {
            border-color: var(--secondary-color);
            transform: translateX(-5px);
        }

        .option-item.selected {
            border-color: var(--primary-color);
            background: rgba(74, 144, 226, 0.1);
        }

        .option-item.correct {
            border-color: var(--success-color);
            background: rgba(57, 237, 132, 0.1);
        }

        .option-letter {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: var(--secondary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .9rem;
            flex-shrink: 0;
        }

        .option-item.selected .option-letter {
            background: var(--primary-color);
        }

        .option-item.correct .option-letter {
            background: var(--success-color);
        }

        .option-text {
            flex: 1;
            font-size: 1.2rem;
            line-height: 1.5;
            color: var(--text-color);
        }

        /* حط ده في اخر الـ CSS */
        .option-item.wrong {
            background: rgba(249, 0, 0, 0.1) !important;
            border-color: #ff0000 !important;
            border-right: 5px solid #ff0000 !important;
            color: white !important;
        }

        .option-item.wrong .option-letter {
            background: #ff0000 !important;
            color: white !important;
        }

        .option-item.wrong::after {
            content: "❌";
            margin-right: 8px;
            font-size: 1rem;
        }

        .option-item.correct::after {
            content: "✔️";
            margin-right: 8px;
            font-size: 1rem;
        }


        /* أصوات */
        .sound-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--primary-color);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            display: none;
            z-index: 2000;
            animation: slideIn 0.3s;
        }

        .sound-indicator.show {
            display: block;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .quiz-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                max-height: 200px;
            }

            .units-list {
                max-height: 100px;
            }

            .question-text {
                font-size: 1.5rem;
            }

            .answer-text {
                font-size: 1.4rem;
            }

            .stopwatch-controls {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body class="custom-scroll">
    <!-- الهيدر -->
    <header class="quiz-header">
        <button class="back-btn" onclick="goBack()">
            <span class="emoji-icon">←</span> العودة
        </button>

        <div class="header-title">
            <h1>عرض تفاعلي - <span id="className">الصف الأول ثانوي</span></h1>
        </div>

        <div class="header-controls">
            <button class="icon-btn theme-toggle" id="themeToggle" title="الوضع الداكن">
                <span class="emoji-icon">🌙</span>
            </button>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <div class="quiz-container">
        <!-- السايدبار -->
        <div class="sidebar ">
            <!-- الوحدات -->
            <div class="units-section ">
                <h3>
                    <span class="emoji-icon">📚</span>
                    الوحدات الدراسية
                </h3>
                <ul class="units-list custom-scroll" id="unitsList">
                    <!-- سيتم ملؤها ديناميكياً -->
                </ul>
            </div>

            <!-- أنواع الأسئلة (ستظهر عند اختيار وحدة) -->
            <div class="unit-types custom-scroll" id="unitTypes">
                <h4>
                    <span class="emoji-icon">🎯</span>
                    أنواع الأسئلة
                </h4>
                <div class="type-buttons">
                    <button class="type-btn" onclick="selectQuestionType('essay')" id="typeEssay">
                        <span>✍️ مقالي</span>
                        <span class="type-count" id="countEssay">0</span>
                    </button>
                    <button class="type-btn" onclick="selectQuestionType('mcq')" id="typeMCQ">
                        <span>🔘 اختياري</span>
                        <span class="type-count" id="countMCQ">0</span>
                    </button>
                    <button class="type-btn" onclick="selectQuestionType('truefalse')" id="typeTrueFalse">
                        <span>✔️❌ صح/خطأ</span>
                        <span class="type-count" id="countTrueFalse">0</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- منطقة المربعات -->
        <div class="questions-grid-container">
            <div class="grid-header">
                <h2>
                    <span id="gridTitle">اختر وحدة ونوع الأسئلة</span>
                </h2>
                <!-- Stopwatch -->
                <div class="stopwatch-controls">
                    <button class="stopwatch-btn" onclick="startStopwatch()" id="startStopwatch" title="بدء المؤقت">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8 5v14l11-7z" />
                        </svg>
                    </button>
                    <button class="stopwatch-btn" onclick="pauseStopwatch()" id="pauseStopwatch" style="display: none;"
                        title="إيقاف">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <rect x="6" y="4" width="4" height="16" rx="1" />

    <script>
        let currentClassId = null;
        let currentClassName = '';
        let currentUnitId = null;
        let currentUnitName = '';
        let currentQuestionType = '';
        let currentQuestions = [];
        let selectedQuestionIndex = null;
        let timerInterval = null;
        let timeLeft = 60;
        let usedQuestions = new Set();
        // أضف بعد المتغيرات الموجودة
        let correctMCQAnswer = null;
        let correctTrueFalseAnswer = null;
        
        

        // Stopwatch
        let stopwatchInterval = null;
        let stopwatchSeconds = 0;
        let stopwatchRunning = false;

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            currentClassId = urlParams.get('class');
            currentClassName = urlParams.get('name') || 'الصف الأول ثانوي';

            document.getElementById('className').textContent = currentClassName;

            loadUnits();
            setupEventListeners();
            setupGrid();
        });

        function setupEventListeners() {
            const toggleBtn = document.getElementById("themeToggle");
            const icon = document.querySelector("#themeToggle span");

            // استعادة المود عند تحميل الصفحة
            const savedMode = localStorage.getItem("darkMode");
            if (savedMode === "true") {
                document.body.classList.add("dark-mode");
                icon.textContent = "☀️";
            } else {
                document.body.classList.remove("dark-mode");
                icon.textContent = "🌙";
            }

            // تبديل المود عند الضغط على الزر
            toggleBtn.onclick = () => {
                document.body.classList.toggle("dark-mode");
                const isDark = document.body.classList.contains("dark-mode");
                icon.textContent = isDark ? "☀️" : "🌙";

                // حفظ الحالة في LocalStorage
                localStorage.setItem("darkMode", isDark);
            };
        }


       // ⭐ دالة تشغيل الأصوات مع منع التكرار ⭐
        let lastSoundTime = {};
        let soundCooldown = 400; // 400ms بين كل صوت من نفس النوع

        function playSound(type) {
    try {
        const now = Date.now();
        const lastTime = lastSoundTime[type] || 0;
        
        // ★★ لو الصوت اتشغل من أقل من 400ms، ما تشغلهوش ★★
        if (now - lastTime < soundCooldown) {
            console.log(`⏳ تخطي صوت ${type} - قريب جداً من التشغيل السابق`);
            return;
        }
        
        lastSoundTime[type] = now; // ★★ سجل وقت التشغيل ★★
        
        const audio = new Audio();
        const soundPaths = {
            'reveal': '../assets/sounds/reveal.mp3',
            'correct': '../assets/sounds/correct.mp3',
            'wrong': '../assets/sounds/wrong.mp3',
            'select': '../assets/sounds/select.mp3',
            'score': '../assets/sounds/score.mp3',
            'timeout': '../assets/sounds/timeout.mp3',
            'coin': '../assets/sounds/coin.mp3',
            'timeEX': '../assets/sounds/timeEX.wav',
            'open': '../assets/sounds/select.mp3',
            'box_click': '../assets/sounds/select.mp3'
        };

        if (soundPaths[type]) {
            audio.src = soundPaths[type];
            audio.volume = 0.6;
            
            // ★★ reset الصوت لو كان شغال ★★
            audio.pause();
            audio.currentTime = 0;
            
            audio.play().catch(e => {
                console.log('⚠️ تعذر تشغيل الصوت:', e.message);
                delete lastSoundTime[type];
            });
        }
    } catch (error) {
        console.log('⚠️ خطأ في تشغيل الصوت:', error);
    }
}


        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            currentClassId = urlParams.get('class');
            currentClassName = urlParams.get('name') || 'الصف الأول ثانوي';

            document.getElementById('className').textContent = currentClassName;

            loadUnits();
            setupEventListeners();
            setupGrid();
        });

        async function loadUnits() {
            try {
                const units = await window.database.getUnits(parseInt(currentClassId));
                displayUnits(units);
            } catch (error) {
                console.error('خطأ في تحميل الوحدات:', error);
            }
        }

        function displayUnits(units) {
            const unitsList = document.getElementById('unitsList');

            if (!units || units.length === 0) {
                unitsList.innerHTML = `
                    <div style="text-align: center; padding: 15px; color: var(--text-color); opacity: 0.7;">
                        <div style="font-size: 1.5rem; margin-bottom: 8px;">📚</div>
                        <div>لا توجد وحدات بعد</div>
                    </div>
                `;
                return;
            }

            let html = '';
            units.forEach(unit => {
                html += `
                    <li class="unit-item" onclick="selectUnit(${unit.id}, '${unit.name.replace(/'/g, "\\'")}')">
                        <div class="unit-name">${unit.name}</div>
                        <div class="unit-count">${unit.question_count || 0}</div>
                    </li>
                `;
            });

            unitsList.innerHTML = html;
        }

        async function selectUnit(unitId, unitName) {
            // إخفاء أنواع الوحدة السابقة
            document.getElementById('unitTypes').classList.remove('active');

            // إزالة التحديد من جميع الوحدات
            document.querySelectorAll('.unit-item').forEach(item => {
                item.classList.remove('active');
            });

            // تحديد الوحدة الجديدة
            const clickedItem = event.target.closest('.unit-item');
            if (clickedItem) {
                clickedItem.classList.add('active');
            }

            currentUnitId = unitId;
            currentUnitName = unitName;
            currentQuestionType = '';

            // إظهار أنواع أسئلة الوحدة
            const unitTypes = document.getElementById('unitTypes');
            unitTypes.classList.add('active');

            // تحديث العنوان
            document.getElementById('gridTitle').textContent = `أسئلة ${unitName}`;

            // إعادة تعليم أنواع الأسئلة
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // مسح المربعات القديمة
            clearGrid();

            // تحميل إحصائيات الوحدة
            loadUnitStats(unitId);
            playSound('select');
        }

        async function loadUnitStats(unitId) {
            try {
                const stats = await window.database.getQuestionStats(parseInt(currentClassId), unitId);

                document.getElementById('countEssay').textContent = stats.essay || 0;
                document.getElementById('countMCQ').textContent = stats.mcq || 0;
                document.getElementById('countTrueFalse').textContent = stats.truefalse || 0;

                const total = (stats.essay || 0) + (stats.mcq || 0) + (stats.truefalse || 0);
                document.getElementById('totalQuestions').textContent = total;
            } catch (error) {
                console.error('خطأ في تحميل الإحصائيات:', error);
            }
        }

        async function selectQuestionType(type) {
            console.log(`تم اختيار نوع الأسئلة: ${type}`);
            currentQuestionType = type;

            // تحديث التحديد البصري
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            const typeElement = document.getElementById(`type${type.charAt(0).toUpperCase() + type.slice(1)}`);
            if (typeElement) {
                typeElement.classList.add('active');
            }

            // تحميل الأسئلة
            await loadQuestions(type);
            playSound('select');
        }

        async function loadQuestions(type) {
            try {
                console.log(`جاري تحميل أسئلة النوع: ${type} للوحدة: ${currentUnitId}`);

                currentQuestions = await window.database.getQuestions(
                    parseInt(currentClassId),
                    currentUnitId,
                    type
                );

                console.log(`✅ تم تحميل ${currentQuestions.length} سؤال من نوع ${type}`);

                if (currentQuestions.length === 0) {
                    console.log(`⚠️ لا توجد أسئلة من نوع ${type} في هذه الوحدة`);
                    createBoxes(0);

                    const typeNames = {
                        essay: 'مقالية',
                        mcq: 'اختيارية',
                        truefalse: 'صح/خطأ'
                    };
                    document.getElementById('gridTitle').textContent =
                        `أسئلة ${currentUnitName} - ${typeNames[type]} (لا توجد أسئلة)`;
                    return;
                }

                // خلط الأسئلة عشوائياً
                shuffleArray(currentQuestions);

                // إنشاء المربعات
                createBoxes(currentQuestions.length);

                // تحديث الإحصائيات
                document.getElementById('shownQuestions').textContent = usedQuestions.size;

                // تحديث العنوان
                const typeNames = {
                    essay: 'مقالية',
                    mcq: 'اختيارية',
                    truefalse: 'صح/خطأ'
                };
                document.getElementById('gridTitle').textContent =
                    `أسئلة ${currentUnitName} - ${typeNames[type]} (${currentQuestions.length} سؤال)`;

            } catch (error) {
                console.error('❌ خطأ في تحميل الأسئلة:', error);
                alert(`حدث خطأ في تحميل الأسئلة: ${error.message}`);
            }
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function setupGrid() {
            const grid = document.getElementById('questionsGrid');
            const container = grid.parentElement;

            function resizeGrid() {
                const containerWidth = container.clientWidth;
                const boxSize = 35;
                const gap = 6;

                const boxesPerRow = Math.floor((containerWidth - gap) / (boxSize + gap));
                grid.style.gridTemplateColumns = `repeat(${boxesPerRow}, ${boxSize}px)`;
            }

            resizeGrid();
            window.addEventListener('resize', resizeGrid);
        }


        function createBoxes(count) {
            const grid = document.getElementById('questionsGrid');
            grid.innerHTML = "";  // ← يمسح المربعات القديمة (فتختفي opened)

            for (let i = 0; i < count; i++) {
                const box = document.createElement("div");
                box.className = "box";
                box.textContent = i + 1;
                box.dataset.index = i;

                // المربعات المستخدمة فعليًا
                if (usedQuestions.has(i)) {
                    box.classList.add("used");
                }

                box.onclick = () => openQuestion(i);
                grid.appendChild(box);
            }
        }


        function clearGrid() {
            const grid = document.getElementById('questionsGrid');
            grid.innerHTML = '';
            currentQuestions = [];
            usedQuestions.clear();
        }

        function openQuestion(index) {
    if (usedQuestions.has(index)) {
        return;
    }

    selectedQuestionIndex = index;
    const question = currentQuestions[index];
    if (!question) return;

    document.getElementById('questionNumber').textContent = `#${index + 1}`;
    document.getElementById('modalQuestionText').textContent = question.text;
    document.getElementById('questionUnit').textContent = currentUnitName;

    const typeText = question.type === 'essay' ? 'مقالي' :
                    question.type === 'mcq' ? 'اختياري' : 'صح/خطأ';
    document.getElementById('questionType').textContent = typeText;

    // إخفاء الأقسام
    document.getElementById('questionOptions').style.display = 'none';
    document.getElementById('answerSection').style.display = 'none';

    // تحديد الإجابة الصحيحة
    let correctAnswerIndex = 0;
    let correctAnswerValue = '';
    
    try {
        if (question.type === 'mcq') {
            if (question.answer !== null && question.answer !== undefined) {
                correctAnswerIndex = parseInt(question.answer) - 1;
                if (isNaN(correctAnswerIndex) || correctAnswerIndex < 0) correctAnswerIndex = 0;
            }
        } else if (question.type === 'truefalse') {
            // تخزين الإجابة الصحيحة لأسئلة صح/خطأ
            if (question.answer === 'true' || question.answer === true || question.answer === 1 || question.answer === '1') {
                correctAnswerValue = 'true';
            } else {
                correctAnswerValue = 'false';
            }
        }
    } catch (error) {
        correctAnswerIndex = 0;
        correctAnswerValue = 'false';
    }

    correctMCQAnswer = correctAnswerIndex;
    correctTrueFalseAnswer = correctAnswerValue;

    // عرض الاختيارات
    if (question.type === 'mcq') {
        displayMCQOptions(question, correctAnswerIndex);
    } else if (question.type === 'truefalse') {
        displayTrueFalseOptions(); // ⬅️ جديد
    }

    // نص الإجابة
    let answerText = '';
    if (question.type === 'essay') {
        answerText = question.answer || 'لا توجد إجابة';
    } else if (question.type === 'mcq') {
        let options = [];
        try { if (question.options) options = JSON.parse(question.options); } catch { }
        const letters = ['أ', 'ب', 'ج', 'د'];
        answerText = `الإجابة الصحيحة: ${letters[correctAnswerIndex] || (correctAnswerIndex + 1)} - ${options[correctAnswerIndex] || ''}`;
    } else if (question.type === 'truefalse') {
        answerText = correctAnswerValue === 'true' ? 'صح ✅' : 'خطأ ❌';
    }

    document.getElementById('modalAnswerText').textContent = answerText;
    document.getElementById('modalAnswerText').className = 'answer-text';

    document.getElementById('revealBtn').style.display = 'flex';

    startTimer();
    document.getElementById('questionModal').classList.add('active');

    // تثبيت اللون الأصفر للمربع المفتوح
    const box = document.querySelector(`.box[data-index="${index}"]`);
    if (box) box.classList.add("opened");

    // تشغيل الصوت مع delay
    setTimeout(() => {
        playSound('select');
    }, 100);
}
        
        // دالة اختيار الخيار (اختيارية - إذا أردت تفاعلية)
        function selectOption(selectedIndex, correctAnswer, options) {
            const optionItems = document.querySelectorAll('.option-item');

            optionItems.forEach((item, i) => {
                item.classList.remove('selected', 'correct');

                if (i === selectedIndex) {
                    item.classList.add('selected');
                }

                if (i === parseInt(correctAnswer)) {
                    item.classList.add('correct');
                }
            });
        }

        function startTimer() {
            timeLeft = 60;
            updateTimerDisplay();

            if (timerInterval) {
                clearInterval(timerInterval);
            }

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    showAnswer();
                    playSound('timeout');
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('questionTimer').textContent =
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            const timer = document.getElementById('questionTimer');
            if (timeLeft <= 10) {
                timer.style.color = 'var(--danger-color)';
            } else if (timeLeft <= 30) {
                timer.style.color = 'var(--warning-color)';
            } else {
                timer.style.color = '#ffeb3b';
            }
        }

        function revealAnswer() {
    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }

    document.getElementById('answerSection').style.display = 'block';
    document.getElementById('revealBtn').style.display = 'none';

    const currentQuestion = currentQuestions[selectedQuestionIndex];
    const isMCQ = currentQuestion.type === 'mcq';
    const isTrueFalse = currentQuestion.type === 'truefalse';
    
    if (isMCQ) {
        // ★★ للأسئلة الاختيارية ★★
        const correctIndex = correctMCQAnswer || 0;
        const optionItems = document.querySelectorAll('.option-item');
        const selectedOption = document.querySelector('.option-item.selected');
        const userChoice = selectedOption ? parseInt(selectedOption.dataset.index) : -1;

        let soundPlayed = false;

        optionItems.forEach((item, i) => {
            if (i === correctIndex) {
                item.classList.add('correct');
                item.classList.add('selected');
            }
            else if (i === userChoice && userChoice !== correctIndex) {
                item.classList.add('wrong');
                item.classList.remove('selected');
                if (!soundPlayed) {
                    playSound('wrong');
                    soundPlayed = true;
                }
            }
            else {
                item.classList.remove('selected');
            }
        });

        if (userChoice === -1) {
            if (!soundPlayed) {
                playSound('reveal');
                soundPlayed = true;
            }
        }
        else if (userChoice === correctIndex) {
            if (!soundPlayed) {
                playSound('correct');
                soundPlayed = true;
            }
        }
    } 
    else if (isTrueFalse) {
        // ★★ لأسئلة صح/خطأ ★★
        const correctAnswer = correctTrueFalseAnswer || 'false';
        console.log('✅ الإجابة الصحيحة لسؤال صح/خطأ:', correctAnswer);
        
        const optionItems = document.querySelectorAll('.option-item');
        const selectedOption = document.querySelector('.option-item.selected');
        const userChoice = selectedOption ? selectedOption.dataset.value : null;
        console.log('👤 اختيار المستخدم:', userChoice);

        // أولاً: إزالة التحديد من كل الخيارات
        optionItems.forEach((item) => {
            item.classList.remove('selected', 'correct', 'wrong');
        });

        // ثانياً: تلوين الإجابة الصحيحة باللون الأخضر
        optionItems.forEach((item) => {
            const itemValue = item.dataset.value;
            if (itemValue === correctAnswer) {
                item.classList.add('correct');
                console.log('✅ تم تلوين الإجابة الصحيحة:', itemValue);
            }
        });

        // ثالثاً: إذا كان المستخدم اختار إجابة
        if (userChoice !== null) {
            // البحث عن العنصر الذي اختاره المستخدم
            const userSelectedItem = document.querySelector(`.option-item[data-value="${userChoice}"]`);
            
            if (userSelectedItem) {
                // إذا كانت إجابته صحيحة
                if (userChoice === correctAnswer) {
                    console.log('🎯 المستخدم أجاب إجابة صحيحة');
                    playSound('correct');
                } 
                // إذا كانت إجابته خاطئة
                else {
                    console.log('❌ المستخدم أجاب إجابة خاطئة');
                    playSound('wrong');
                    userSelectedItem.classList.add('wrong');
                }
            }
        } 
        // رابعاً: إذا لم يختار المستخدم أي إجابة
        else {
            console.log('👁️ لم يختار المستخدم أي إجابة');
            playSound('reveal');
        }
    }
    else {
        // ★★ لأسئلة مقالية ★★
        console.log('📝 سؤال مقالي');
        playSound('reveal');
    }
}


        // ⭐ دالة لعرض خيارات "صح/خطأ"
        function displayTrueFalseOptions() {
    const optionsContainer = document.getElementById('questionOptions');
    optionsContainer.innerHTML = '';
    optionsContainer.style.display = 'block';

    const trueFalseOptions = [
        { text: 'صح', value: 'true', emoji: '✓' },
        { text: 'خطأ', value: 'false', emoji: 'X' }
    ];

    trueFalseOptions.forEach((option) => {
        const optionDiv = document.createElement('div');
        optionDiv.className = 'option-item';
        optionDiv.dataset.value = option.value;

        optionDiv.innerHTML = `
            <div class="option-letter">${option.emoji}</div>
            <div class="option-text">${option.text}</div>
        `;

        optionDiv.onclick = () => {
            document.querySelectorAll('.option-item').forEach(item => {
                item.classList.remove('selected');
            });
            optionDiv.classList.add('selected');
            playSound('select');
        };

        optionsContainer.appendChild(optionDiv);
    });
}

        // ⭐ دالة لعرض خيارات MCQ
        function displayMCQOptions(question, correctIndex = 0) {
    const optionsContainer = document.getElementById('questionOptions');
    optionsContainer.innerHTML = '';
    optionsContainer.style.display = 'block';

    let options = [];
    try {
        if (question.options) options = JSON.parse(question.options);
    } catch {
        options = ['الخيار الأول', 'الخيار الثاني', 'الخيار الثالث', 'الخيار الرابع'];
    }

    const letters = ['أ', 'ب', 'ج', 'د'];

    options.forEach((option, i) => {
        const optionDiv = document.createElement('div');
        optionDiv.className = 'option-item';
        optionDiv.dataset.index = i;

        optionDiv.innerHTML = `
            <div class="option-letter">${letters[i] || (i + 1)}</div>
            <div class="option-text">${option || `الخيار ${i + 1}`}</div>
        `;

        optionDiv.onclick = () => {
            document.querySelectorAll('.option-item').forEach(item => {
                item.classList.remove('selected', 'correct', 'wrong');
            });
            optionDiv.classList.add('selected');
            playSound('select');
        };

        optionsContainer.appendChild(optionDiv);
    });
}


        function showAnswer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }

            document.getElementById('answerSection').style.display = 'block';
            document.getElementById('revealBtn').style.display = 'none';

            // ❌ إزالة نظام used بالكامل

            playSound('timeout');
        }

        // Stopwatch functions
        function startStopwatch() {
            if (stopwatchRunning) return;

            stopwatchRunning = true;
            document.getElementById('startStopwatch').style.display = 'none';
            document.getElementById('pauseStopwatch').style.display = 'flex';

            stopwatchInterval = setInterval(() => {
                stopwatchSeconds++;
                updateStopwatchDisplay();
            }, 1000);
            playSound('select');
        }

        function pauseStopwatch() {
            stopwatchRunning = false;
            document.getElementById('startStopwatch').style.display = 'flex';
            document.getElementById('pauseStopwatch').style.display = 'none';

            if (stopwatchInterval) {
                clearInterval(stopwatchInterval);
                stopwatchInterval = null;
            }
            playSound('score');
        }

        function resetStopwatch() {
            pauseStopwatch();
            stopwatchSeconds = 0;
            updateStopwatchDisplay();
            playSound('timeout');
        }

        function updateStopwatchDisplay() {
            const hours = Math.floor(stopwatchSeconds / 3600);
            const minutes = Math.floor((stopwatchSeconds % 3600) / 60);
            const seconds = stopwatchSeconds % 60;

            const display = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            document.getElementById('stopwatchDisplay').textContent = display;
        }

        function closeQuestionModal() {
            document.getElementById('questionModal').classList.remove('active');

            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            playSound('score');
        }

        function goBack() {
            window.location.href = `class-details.html?id=${currentClassId}&name=${encodeURIComponent(currentClassName)}`;
        }
    </script>
